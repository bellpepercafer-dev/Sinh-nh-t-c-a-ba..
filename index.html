<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Ba!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        h1 {
            color: #d9534f;
            margin-bottom: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            margin: 0 auto 30px auto;
        }
        .gallery img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        .audio-container {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            display: inline-block;
            border-radius: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>🎉 Chúc Mừng Sinh Nhật Ba! 🎂</h1>
    <p>Chúc Ba luôn luôn mạnh khỏe, vui vẻ và hạnh phúc bên gia đình!</p>

    <!-- Nơi hiển thị các bức ảnh (tên file phải khớp chính xác 100% trên GitHub) -->
    <div class="gallery">
        <img src="anh1.jpg" alt="Ảnh kỷ niệm 1">
        <img src="anh2.jpg" alt="Ảnh kỷ niệm 2">
        <img src="anh3.jpg" alt="Ảnh kỷ niệm 3">
        <img src="anh4.jpg" alt="Ảnh kỷ niệm 4">
        <img src="anh6.jpg" alt="Ảnh kỷ niệm 5">
    </div>

    <!-- Nhạc nền (khớp tên nhac.mp4 trên GitHub) -->
    <div class="audio-container">
        <p>🎵 Nhạc nền sinh nhật:</p>
        <audio controls autoplay loop>
           <source src="video.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ phát nhạc.
        </audio>
    </div>

</body>
</html>
